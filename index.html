<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Conferência de Cisternas</title>
<style>
:root{
 --panel:rgba(255,255,255,.96);--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;
 --shadow:0 10px 28px rgba(0,0,0,.16);--blue:#2563eb;--blue2:#1d4ed8;
 --green:#16a34a;--orange:#f59e0b;--red:#dc2626;
}
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;font-family:Segoe UI,Arial,sans-serif;color:var(--text)}
.panel{background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:16px}
button,select,input{font:inherit}

/* BUSCA + FILTRO */
.search-panel{position:fixed;z-index:20;top:16px;left:16px;width:350px;padding:10px}
.search-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:0 10px}
.search-wrap svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search-wrap input{width:100%;border:0;outline:0;padding:11px 0;background:transparent}
#municipalityFilter{width:100%;margin-top:8px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;color:var(--text)}
.search-results{display:none;margin-top:8px;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px}
.search-results.open{display:block}
.search-item{padding:9px 11px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px}
.search-item:hover{background:#f8fafc}
.search-item small{display:block;color:var(--muted);margin-top:2px}

/* NAVEGAÇÃO */
.nav-panel{position:fixed;z-index:19;top:16px;left:50%;transform:translateX(-50%);padding:8px 10px;display:flex;align-items:center;gap:8px}
.nav-btn{width:42px;height:42px;border:0;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center;cursor:pointer}
.nav-btn:hover{background:#000}
.nav-btn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.5}
.status{text-align:center;min-width:280px;line-height:1.22}
.status .counter{font-size:13px;font-weight:800}
.status .name{font-size:13px;font-weight:700;margin-top:2px}
.status .meta{font-size:11px;color:var(--muted);margin-top:2px}
.jump{display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:5px 8px}
.jump span{font-size:11px;color:var(--muted)}
.jump input{width:58px;border:0;outline:0;text-align:center;font-weight:700}

/* DUPLICIDADES */
.dup-panel{position:fixed;z-index:18;top:88px;right:16px;width:330px;padding:12px}
.panel-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:7px}
.panel-title svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:2}
.dup-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.badge{min-width:26px;height:22px;padding:0 7px;border-radius:999px;background:#f3f4f6;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.badge.warn{background:#fff7ed;color:#c2410c}
#radius{width:58px;border:1px solid var(--border);border-radius:8px;padding:5px}
.dup-actions{display:flex;gap:8px;margin-top:9px}
.icon-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:#f8fafc}
.icon-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.icon-btn.primary:hover{background:var(--blue2);color:#fff}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.dup-list{display:none;max-height:220px;overflow:auto;margin-top:8px;border-top:1px solid var(--border)}
.dup-list.open{display:block}
.dup-item{padding:7px 2px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px}
.dup-item:hover{background:#f8fafc}

/* AÇÕES / EXPORTAÇÃO */
.action-panel{position:fixed;z-index:18;right:16px;bottom:82px;width:330px;padding:11px}
.action-header{display:flex;justify-content:space-between;align-items:center}
.action-title{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px}
.action-title svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:2}
.changed{color:#b45309;font-weight:800}
.action-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.action-row button{height:38px;border-radius:10px;border:1px solid var(--border);padding:0 11px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700}
.action-row svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.primary-action{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.primary-action:hover{background:var(--blue2)!important;color:#fff!important}
.secondary-action{background:#fff;color:var(--text)}
.secondary-action:hover{background:#f8fafc;color:var(--text)}
.danger-action{background:#fff;color:var(--red)}
.danger-action:hover{background:#fef2f2;color:var(--red)}
.hint{font-size:11px;color:var(--muted);margin-top:7px}

/* BENEFICIÁRIO INFERIOR ESQUERDO */
.info-card{position:fixed;z-index:18;left:16px;bottom:16px;width:420px;max-width:calc(100vw - 32px);padding:11px 12px}
.info-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-meta{font-size:11px;color:var(--muted);margin-top:3px}
.info-details{display:none;margin-top:8px;font-size:12px;line-height:1.55}
.info-card.expanded .info-details{display:block}
.copyable{cursor:pointer;border-radius:4px;padding:1px 3px}
.copyable:hover{background:#eef2ff;color:#1d4ed8}
.copy-hint{font-size:10px;color:var(--muted);margin-top:5px}

/* ZOOM */
.zoom-panel{position:fixed;z-index:18;right:16px;bottom:16px;padding:6px;display:flex;gap:6px}
.zoom-panel button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:700;cursor:pointer}
.zoom-panel button:hover{background:#f8fafc}

/* HUD DO ARRASTE */
.live-coordinate{position:fixed;z-index:30;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:rgba(17,24,39,.96);color:#fff;padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.15s;min-width:320px;text-align:center}
.live-coordinate.show{opacity:1;transform:translateX(-50%) translateY(0)}
.live-coordinate .label{font-size:11px;color:#cbd5e1}
.live-coordinate .coords{display:block;margin-top:3px;font-family:Consolas,monospace;font-size:14px;font-weight:800}
.toast{position:fixed;z-index:40;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 12px;border-radius:10px;opacity:0;pointer-events:none;transition:.15s;font-size:12px}
.toast.show{opacity:1}

@media(max-width:950px){
 .search-panel{width:310px}
 .dup-panel,.action-panel{width:290px}
}
@media(max-width:760px){
 .search-panel{top:10px;left:10px;width:calc(100vw - 20px)}
 .nav-panel{top:112px;width:calc(100vw - 20px)}
 .dup-panel,.action-panel{display:none}
 .info-card{left:10px;bottom:10px;width:calc(100vw - 135px)}
 .zoom-panel{right:10px;bottom:10px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="search-panel panel">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Buscar beneficiário">
  </div>
  <select id="municipalityFilter"><option value="">Todos os municípios</option></select>
  <div id="searchResults" class="search-results"></div>
</div>

<div class="nav-panel panel">
  <button id="prev" class="nav-btn" title="Anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="status">
    <div id="counter" class="counter"></div>
    <div id="currentName" class="name"></div>
    <div id="currentMeta" class="meta"></div>
  </div>
  <button id="next" class="nav-btn" title="Próximo"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="jump"><span>Ir para</span><input id="jump" type="number" min="1"></div>
</div>

<div class="dup-panel panel">
  <div class="panel-title"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3L12 3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>Conferência de duplicidade</span></div>
  <div class="dup-row"><span>Coordenadas idênticas</span><b id="exact" class="badge">0</b></div>
  <div class="dup-row"><span>Nomes repetidos</span><b id="names" class="badge">0</b></div>
  <div class="dup-row"><span>Próximas até <input id="radius" type="number" min="1" max="100" value="15"> m</span><b id="near" class="badge">0</b></div>
  <div class="dup-row"><span>Pontos suspeitos</span><b id="sus" class="badge warn">0</b></div>
  <div class="dup-actions">
    <button id="nextdup" class="icon-btn primary" title="Próxima suspeita"><svg viewBox="0 0 24 24"><path d="M6 12h12"/><path d="M14 8l4 4-4 4"/></svg></button>
    <button id="listbtn" class="icon-btn" title="Ver lista"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  </div>
  <div id="duplist" class="dup-list"></div>
</div>

<div class="action-panel panel">
  <div class="action-header">
    <div class="action-title"><svg viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16v4z"/><path d="M13 6l4 4"/></svg><span>Correções</span></div>
    <div>Alteradas: <span id="changedCount" class="changed">0</span></div>
  </div>
  <div class="action-row">
    <button id="exportBtn" class="primary-action"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg><span>Exportar</span></button>
    <button id="importBtn" class="secondary-action"><svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg><span>Importar</span></button>
    <input id="importFile" type="file" accept=".csv,text/csv" hidden>
    <button id="resetBtn" class="danger-action" title="Desfazer todas"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>
  </div>
  <div class="hint">Arraste qualquer marcador até a posição correta. As alterações ficam salvas neste navegador.</div>
</div>

<div id="infoCard" class="info-card panel">
  <div class="info-top">
    <div style="min-width:0">
      <div id="infoName" class="info-name"></div>
      <div id="infoMeta" class="info-meta"></div>
    </div>
    <button id="detailBtn" class="icon-btn" title="Detalhes">⋯</button>
  </div>
  <div id="infoDetails" class="info-details"></div>
</div>

<div class="zoom-panel panel">
  <button onclick="map.setZoom(18)">Z18</button>
  <button onclick="map.setZoom(20)">Z20</button>
  <button onclick="map.setZoom(21)">Z21</button>
  <button onclick="map.setZoom(22)">Z22</button>
</div>

<div id="liveCoordinate" class="live-coordinate"><span class="label">Coordenada atual</span><span id="liveCoordinateText" class="coords">—</span></div>
<div id="toast" class="toast">Copiado</div>

function warnings(p){
 const a=[];
 dup.exactGroups.forEach(g=>{if(g.some(x=>x.id===p.id))a.push("Coordenada idêntica a "+g.filter(x=>x.id!==p.id).map(x=>`#${x.id} ${x.name}`).join(", "))});
 dup.nameGroups.forEach(g=>{if(g.some(x=>x.id===p.id))a.push("Nome repetido em "+g.filter(x=>x.id!==p.id).map(x=>`#${x.id}`).join(", "))});
 dup.nearPairs.forEach(x=>{if(x.a.id===p.id)a.push(`${x.distance.toFixed(1)} m de #${x.b.id} ${x.b.name}`);if(x.b.id===p.id)a.push(`${x.distance.toFixed(1)} m de #${x.a.id} ${x.a.name}`)});
 return a
}
function renderInfo(){
 const p=points[current], w=warnings(p);
 infoName.textContent=`#${p.id} — ${p.name}`;
 infoMeta.textContent=`${p.municipio} — ${p.localidade}`;
 infoDetails.innerHTML=
  copySpan("Nome",p.name)+"<br>"+
  copySpan("Município",p.municipio)+"<br>"+
  copySpan("Localidade",p.localidade)+"<br>"+
  copySpan("Latitude",p.lat.toFixed(8))+"<br>"+
  copySpan("Longitude",p.lon.toFixed(8))+"<br>"+
  copySpan("Coordenada",fmt(p.lat,p.lon))+"<br>"+
  copySpan("Original",p.original)+
  `<div class="copy-hint">Clique em qualquer dado para copiar.</div>`+
  (movedPoints[p.id]?`<br><b class="changed">Posição corrigida:</b> ${fmt(p.lat,p.lon)}`:"")+
  (w.length?`<br><br><b style="color:#b45309">⚠ Possível duplicidade</b><br>${w.join("<br>")}`:"")
}
function updateUI(){
 const v=visibleIndexes();
 const pos=v.indexOf(current);
 const p=points[current];
 counter.textContent=`Ponto ${pos>=0?pos+1:1} de ${v.length}`;
 currentName.textContent=p.name;
 currentMeta.textContent=`${p.municipio} — ${p.localidade}`;
 jump.max=v.length;
 jump.value=pos>=0?pos+1:1;
 renderInfo();
 refreshMarkerStyles();
 if(info) info.close();
}

function applyFilter(){
 selectedMunicipality=municipalityFilter.value;
 markers.forEach((m,i)=>m.setMap(!selectedMunicipality||norm(points[i].municipio)===norm(selectedMunicipality)?map:null));
 const v=visibleIndexes();
 if(v.length){
  if(!v.includes(current))current=v[0];
  const b=new google.maps.LatLngBounds();
  v.forEach(i=>b.extend({lat:points[i].lat,lng:points[i].lon}));
  if(v.length===1){map.setCenter({lat:points[v[0]].lat,lng:points[v[0]].lon});map.setZoom(20)}
  else map.fitBounds(b,90);
  updateUI();
 }
 renderSearch(search.value)
}
function populateMunicipalities(){
 [...new Set(points.map(p=>p.municipio.trim()))].sort((a,b)=>a.localeCompare(b,"pt-BR")).forEach(m=>{
  const o=document.createElement("option");o.value=m;o.textContent=m;municipalityFilter.appendChild(o)
 })
}
municipalityFilter.onchange=applyFilter;

function renderSearch(q){
 const box=searchResults, nq=norm(q);
 if(!nq){box.classList.remove("open");box.innerHTML="";return}
 const matches=points.filter(p=>(!selectedMunicipality||norm(p.municipio)===norm(selectedMunicipality))&&norm(p.name).includes(nq)).slice(0,30);
 box.innerHTML=matches.length?matches.map(p=>`<div class="search-item" data-id="${p.id}"><b>${esc(p.name)}</b><small>${esc(p.municipio)} — ${esc(p.localidade)}</small></div>`).join(""):'<div class="search-item">Nenhum beneficiário encontrado.</div>';
 box.classList.add("open");
 box.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{const id=+el.dataset.id,currentIdx=points.findIndex(p=>p.id===id);if(currentIdx>=0){current=currentIdx;search.value=points[current].name;box.classList.remove("open");updateUI();focusCurrent(20)}})
}
search.oninput=e=>renderSearch(e.target.value);
search.onkeydown=e=>{if(e.key==="Enter"){const f=searchResults.querySelector("[data-id]");if(f)f.click()}if(e.key==="Escape")searchResults.classList.remove("open")};
document.addEventListener("click",e=>{if(!e.target.closest(".search-panel"))searchResults.classList.remove("open")});

function recalcDup(){
 const r=Math.max(1,Math.min(100,+radius.value||15)), cm=new Map(), nm=new Map();
 points.forEach(p=>{const ck=p.lat.toFixed(8)+","+p.lon.toFixed(8);if(!cm.has(ck))cm.set(ck,[]);cm.get(ck).push(p);const nk=norm(p.name);if(!nm.has(nk))nm.set(nk,[]);nm.get(nk).push(p)});
 const eg=[...cm.values()].filter(g=>g.length>1), ng=[...nm.values()].filter(g=>g.length>1);
 const np=pairs100.filter(x=>x.distance<=r&&x.distance>0.05).map(x=>({a:byId[x.a],b:byId[x.b],distance:x.distance}));
 const s=new Set();eg.forEach(g=>g.forEach(p=>s.add(p.id)));ng.forEach(g=>g.forEach(p=>s.add(p.id)));np.forEach(x=>{s.add(x.a.id);s.add(x.b.id)});
 dup={exactGroups:eg,nameGroups:ng,nearPairs:np,sus:s,ordered:[...s].sort((a,b)=>a-b)};
 exact.textContent=eg.length;names.textContent=ng.length;near.textContent=np.length+" pares";sus.textContent=s.size;renderDupList();refreshMarkerStyles();renderInfo()
}
function renderDupList(){
 const arr=[];
 dup.exactGroups.forEach(g=>arr.push(`<div class="dup-item" data-id="${g[0].id}"><b>Coordenada idêntica</b><br>${g.map(p=>`#${p.id} ${esc(p.name)}`).join("<br>")}</div>`));
 dup.nameGroups.forEach(g=>arr.push(`<div class="dup-item" data-id="${g[0].id}"><b>Nome repetido</b><br>${g.map(p=>`#${p.id} ${esc(p.name)}`).join("<br>")}</div>`));
 dup.nearPairs.forEach(x=>arr.push(`<div class="dup-item" data-id="${x.a.id}"><b>${x.distance.toFixed(1)} m</b><br>#${x.a.id} ${esc(x.a.name)}<br>#${x.b.id} ${esc(x.b.name)}</div>`));
 duplist.innerHTML=arr.length?arr.join(""):"Nenhuma suspeita.";
 duplist.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{const i=points.findIndex(p=>p.id===+el.dataset.id);if(i>=0){current=i;updateUI();focusCurrent(20)}})
}
radius.oninput=recalcDup;
listbtn.onclick=()=>{duplist.classList.toggle("open");listbtn.title=duplist.classList.contains("open")?"Ocultar lista":"Ver lista"};
nextdup.onclick=()=>{if(!dup.ordered.length)return;dupCursor=(dupCursor+1)%dup.ordered.length;const i=points.findIndex(p=>p.id===dup.ordered[dupCursor]);if(i>=0){current=i;updateUI();focusCurrent(20)}};

function showLive(p,lat,lon){liveCoordinateText.textContent=`${p.name} — ${fmt(lat,lon)}`;liveCoordinate.classList.add("show")}
function hideLive(){liveCoordinate.classList.remove("show")}

function saveMoved(){localStorage.setItem(movedKey,JSON.stringify(movedPoints));changedCount.textContent=Object.keys(movedPoints).length}

function exportCorrections(){
 const rows=Object.keys(movedPoints).map(id=>{const p=byId[+id],o=originalPoints[id];return [p.id,p.municipio,p.localidade,p.name,o.lat.toFixed(8),o.lon.toFixed(8),p.lat.toFixed(8),p.lon.toFixed(8),fmt(p.lat,p.lon)]}).sort((a,b)=>a[0]-b[0]);
 if(!rows.length){alert("Nenhuma coordenada foi alterada.");return}
 const headers=["Ponto","Município","Localidade","Beneficiário","Latitude Original","Longitude Original","Latitude Corrigida","Longitude Corrigida","Coordenada Corrigida"];
 const q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const csv=[headers.map(q).join(";"),...rows.map(r=>r.map(q).join(";"))].join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="correcoes_coordenadas_cisternas.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)
}
function parseLine(line,sep){let a=[],c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch=='"'){if(q&&line[i+1]=='"'){c+='"';i++}else q=!q}else if(ch===sep&&!q){a.push(c);c=""}else c+=ch}a.push(c);return a}
function importCsv(file){
 const fr=new FileReader();
 fr.onload=()=>{try{
  const ls=String(fr.result||"").trim().split(/\r?\n/).filter(Boolean),sep=(ls[0].match(/;/g)||[]).length>=(ls[0].match(/,/g)||[]).length?";":",";
  const h=parseLine(ls[0],sep).map(x=>norm(x)),ip=h.indexOf("PONTO"),ila=h.indexOf("LATITUDE CORRIGIDA"),ilo=h.indexOf("LONGITUDE CORRIGIDA");
  if(ila<0||ilo<0)throw new Error("Colunas de coordenadas corrigidas não encontradas.");
  let ok=0;
  for(let i=1;i<ls.length;i++){const c=parseLine(ls[i],sep),id=+c[ip],p=byId[id],lat=Number(String(c[ila]).replace(",",".")),lon=Number(String(c[ilo]).replace(",","."));if(p&&Number.isFinite(lat)&&Number.isFinite(lon)){p.lat=lat;p.lon=lon;movedPoints[p.id]={lat,lon};const mi=points.findIndex(x=>x.id===p.id);if(markers[mi])markers[mi].setPosition({lat,lng:lon});ok++}}
  saveMoved();recalcDup();updateUI();alert(`${ok} correções importadas.`);
 }catch(e){alert("Erro ao importar: "+e.message)}};
 fr.readAsText(file,"utf-8")
}

exportBtn.onclick=exportCorrections;
importBtn.onclick=()=>importFile.click();
importFile.onchange=e=>{const f=e.target.files[0];if(f)importCsv(f);e.target.value=""};
resetBtn.onclick=()=>{if(!confirm("Desfazer todas as correções?"))return;movedPoints={};localStorage.removeItem(movedKey);points.forEach((p,i)=>{const o=originalPoints[p.id];p.lat=o.lat;p.lon=o.lon;if(markers[i])markers[i].setPosition({lat:p.lat,lng:p.lon})});saveMoved();recalcDup();updateUI();focusCurrent(20)};

prev.onclick=()=>navVisible(-1);
next.onclick=()=>navVisible(1);
jump.onchange=e=>{const v=visibleIndexes();let n=Math.min(Math.max(parseInt(e.target.value)||1,1),v.length);current=v[n-1];updateUI();focusCurrent(20)};
detailBtn.onclick=()=>{infoCard.classList.toggle("expanded");detailBtn.textContent=infoCard.classList.contains("expanded")?"×":"⋯"};

document.addEventListener("keydown",e=>{if(document.activeElement?.tagName==="INPUT")return;if(e.key==="ArrowRight")navVisible(1);if(e.key==="ArrowLeft")navVisible(-1);if(e.key.toLowerCase()==="d")nextdup.click()});

function initMap(){
 map=new google.maps.Map(document.getElementById("map"),{center:{lat:points[0].lat,lng:points[0].lon},zoom:20,mapTypeId:"hybrid",mapTypeControl:true,streetViewControl:true,fullscreenControl:true,zoomControl:true,gestureHandling:"greedy"});
 info=new google.maps.InfoWindow();

 points.forEach((p,i)=>{
  const m=new google.maps.Marker({position:{lat:p.lat,lng:p.lon},map,draggable:true,title:`${p.name} — ${p.localidade}, ${p.municipio}`,label:{text:String(p.id),color:"#fff",fontSize:"11px",fontWeight:"bold"},icon:markerIcon(i)});
  m.addListener("click",()=>{current=i;updateUI();const w=warnings(p);info.setContent(copySpan("Nome",p.name)+"<br>"+copySpan("Município",p.municipio)+"<br>"+copySpan("Localidade",p.localidade)+"<br>"+copySpan("Latitude",p.lat.toFixed(8))+"<br>"+copySpan("Longitude",p.lon.toFixed(8))+"<br>"+copySpan("Coordenada",fmt(p.lat,p.lon))+(w.length?`<br><br><b style="color:#b45309">⚠ Possível duplicidade</b><br>${w.join("<br>")}`:""));info.open({anchor:m,map})});
  m.addListener("dragstart",ev=>{current=i;showLive(p,ev.latLng.lat(),ev.latLng.lng());updateUI()});
  m.addListener("drag",ev=>{p.lat=ev.latLng.lat();p.lon=ev.latLng.lng();showLive(p,p.lat,p.lon);renderInfo()});
  m.addListener("dragend",ev=>{p.lat=ev.latLng.lat();p.lon=ev.latLng.lng();m.setPosition({lat:p.lat,lng:p.lon});movedPoints[p.id]={lat:p.lat,lon:p.lon};saveMoved();showLive(p,p.lat,p.lon);setTimeout(hideLive,1000);recalcDup();updateUI()});
  markers.push(m)
 });

 populateMunicipalities();
 saveMoved();
 recalcDup();
 applyFilter();
 updateUI();
 focusCurrent(20);
}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMBu-rnEo5JosoheIKxhOmiEiGTAcgxEA&callback=initMap"></script>
</body>
