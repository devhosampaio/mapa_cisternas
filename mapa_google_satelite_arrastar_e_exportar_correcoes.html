<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de conferência</title>
<style>
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}.top{position:fixed;z-index:10;top:12px;left:50%;transform:translateX(-50%);background:#fffffff5;padding:10px 12px;border-radius:12px;box-shadow:0 3px 14px #0004;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:92vw}.top button{padding:8px 12px}.status{text-align:center;min-width:300px}.status b,.status span{display:block}.meta{font-size:12px;color:#666}.verify.ok{background:#198754;color:#fff}.progress{width:100%;height:6px;background:#ddd;border-radius:8px;overflow:hidden}.bar{height:100%;background:#198754;width:0}.card{position:fixed;z-index:10;left:14px;bottom:14px;background:#fffffff2;padding:9px 11px;border-radius:10px;box-shadow:0 3px 12px #0003;max-width:450px;font-size:13px}.details{display:none;margin-top:7px}.card.expanded .details{display:block}.dup{position:fixed;z-index:10;right:14px;top:115px;width:340px;background:#fffffff2;padding:10px 12px;border-radius:10px;box-shadow:0 3px 12px #0003;font-size:13px}.dup .row{display:flex;justify-content:space-between;margin:4px 0}.dup-list{display:none;max-height:250px;overflow:auto;border-top:1px solid #ddd;margin-top:8px}.dup-list.open{display:block}.dup-item{padding:6px 0;border-bottom:1px solid #eee;cursor:pointer}.zoom{position:fixed;z-index:10;right:14px;bottom:14px;background:#fffffff2;padding:8px;border-radius:10px}.warn{color:#a45a00;font-weight:bold}@media(max-width:750px){.dup{display:none}.status{min-width:220px}}

.search-box{
  position:fixed;z-index:11;top:14px;left:14px;width:320px;
  max-width:calc(100vw - 28px);background:rgba(255,255,255,.97);
  padding:8px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.22)
}
.search-box input{
  width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #aaa;
  border-radius:7px;font-size:14px
}
.search-results{
  display:none;margin-top:6px;max-height:260px;overflow:auto;border-top:1px solid #ddd
}
.search-results.open{display:block}
.search-item{padding:7px 4px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}
.search-item:hover{background:#f4f4f4}
.search-item small{display:block;color:#666;margin-top:2px}


.filter-row{display:flex;gap:6px;margin-top:6px}
.filter-row select{width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid #aaa;border-radius:7px;font-size:13px;background:#fff}


.copyable{
  cursor:pointer;
  border-radius:4px;
  padding:1px 3px;
  transition:background .15s ease
}
.copyable:hover{background:#e9ecef}
.copyable:active{background:#dfe3e6}
.copy-hint{font-size:11px;color:#777;margin-top:6px}
.copy-toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:9999;background:#222;color:#fff;padding:8px 12px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .18s ease;font-size:13px
}
.copy-toast.show{opacity:1}


.save-panel{
  position:fixed;z-index:11;left:14px;bottom:90px;
  background:rgba(255,255,255,.97);padding:9px 10px;border-radius:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.22);font-size:13px;max-width:320px
}
.save-panel button{
  border:1px solid #aaa;background:#fff;border-radius:6px;
  padding:7px 9px;cursor:pointer;font-weight:700;margin-right:5px;margin-top:5px
}
.save-panel .changed{color:#b35a00;font-weight:700}
.drag-hint{font-size:11px;color:#666;margin-top:5px}

</style></head><body>
<div id="copyToast" class="copy-toast">Copiado</div>

<div class="save-panel">
  <div><b>Correções de posição</b></div>
  <div>Alteradas: <span id="changedCount" class="changed">0</span></div>
  <button id="saveCorrectionsBtn">Salvar correções</button>
  <button id="resetCorrectionsBtn">Desfazer todas</button>
  <div class="drag-hint">Arraste a bolinha até a posição correta. As alterações também ficam salvas neste navegador.</div>
</div>


<div class="search-box">
  <input id="beneficiarySearch" type="text" placeholder="Pesquisar beneficiário...">
  <div class="filter-row">
    <select id="municipalityFilter">
      <option value="">Todos os municípios</option>
    </select>
  </div>
  <div id="searchResults" class="search-results"></div>
</div>

<div id="map"></div>
<div class="top">
<button id="prev">←</button><div class="status"><b id="counter"></b><span id="name"></span><span class="meta" id="meta"></span><span class="meta" id="vcount"></span></div><button id="next">→</button>
<button id="verify" class="verify">Marcar como verificada</button>
<label>Ir para <input id="jump" type="number" min="1" style="width:65px"></label>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>
<div class="dup">
<b>Conferência automática de duplicidade</b>
<div class="row"><span>Coordenadas idênticas</span><b id="exact">0</b></div>
<div class="row"><span>Nomes repetidos</span><b id="names">0</b></div>
<div class="row"><span>Próximas até <input id="radius" type="number" min="1" max="100" value="15" style="width:52px"> m</span><b id="near">0</b></div>
<div class="row"><span>Pontos suspeitos</span><b id="sus" class="warn">0</b></div>
<button id="nextdup">Próxima suspeita</button><button id="listbtn">Ver lista</button>
<div id="duplist" class="dup-list"></div>
</div>
<div id="card" class="card"><b id="mininame"></b> <button id="detailbtn">Detalhes ▾</button><div id="details" class="details"></div></div>
<div class="zoom"><button onclick="map.setZoom(18)">Z18</button><button onclick="map.setZoom(20)">Z20</button><button onclick="map.setZoom(21)">Z21</button><button onclick="map.setZoom(22)">Z22</button></div>

const originalPoints = Object.fromEntries(points.map(p => [p.id, {lat:p.lat, lon:p.lon}]));
const movedStorageKey = "coord_review_moved_points_v1";
let movedPoints = JSON.parse(localStorage.getItem(movedStorageKey) || "{}");

function loadMovedPoints(){
  Object.entries(movedPoints).forEach(([id,val])=>{
    const p=points.find(x=>x.id===Number(id));
    if(p && val && Number.isFinite(val.lat) && Number.isFinite(val.lon)){
      p.lat=val.lat;
      p.lon=val.lon;
    }
  });
}

function saveMovedPoints(){
  localStorage.setItem(movedStorageKey, JSON.stringify(movedPoints));
  updateChangedCount();
}

function updateChangedCount(){
  document.getElementById("changedCount").textContent=Object.keys(movedPoints).length;
}

function recalcMovedDistances(){
  // Mantém os marcadores na posição nova e atualiza o painel atual.
  updateChangedCount();
}

function exportCorrections(){
  const rows = Object.keys(movedPoints)
    .map(id=>{
      const p=points.find(x=>x.id===Number(id));
      const orig=originalPoints[id];
      return {
        ponto:p.id,
        municipio:p.municipio,
        localidade:p.localidade,
        beneficiario:p.name,
        latitude_original:orig.lat,
        longitude_original:orig.lon,
        latitude_corrigida:p.lat,
        longitude_corrigida:p.lon,
        coordenada_corrigida:p.lat.toFixed(8)+", "+p.lon.toFixed(8)
      };
    })
    .sort((a,b)=>a.ponto-b.ponto);

  if(!rows.length){
    alert("Nenhuma bolinha foi movida ainda.");
    return;
  }

  const headers = [
    "Ponto","Município","Localidade","Beneficiário",
    "Latitude Original","Longitude Original",
    "Latitude Corrigida","Longitude Corrigida","Coordenada Corrigida"
  ];

  const esc=v=>{
    const s=String(v??"");
    return '"' + s.replace(/"/g,'""') + '"';
  };

  const csv=[
    headers.map(esc).join(";"),
    ...rows.map(r=>[
      r.ponto,r.municipio,r.localidade,r.beneficiario,
      r.latitude_original.toFixed(8),r.longitude_original.toFixed(8),
      r.latitude_corrigida.toFixed(8),r.longitude_corrigida.toFixed(8),
      r.coordenada_corrigida
    ].map(esc).join(";"))
  ].join("\r\n");

  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="correcoes_coordenadas_cisternas.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function resetAllMovedPoints(){
  if(!confirm("Deseja desfazer todas as correções feitas neste navegador?")) return;
  movedPoints={};
  localStorage.removeItem(movedStorageKey);

  points.forEach((p,idx)=>{
    const orig=originalPoints[p.id];
    p.lat=orig.lat;
    p.lon=orig.lon;
    if(markers[idx]){
      markers[idx].setPosition({lat:p.lat,lng:p.lon});
    }
  });

  updateChangedCount();
  update(true);
}

<script>

function normalizeSearchText(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim();
}
function renderSearchResults(term){
  const box=document.getElementById("searchResults");
  const q=normalizeSearchText(term);
  if(!q){
    box.classList.remove("open");
    box.innerHTML="";
    return;
  }
  const matches=points.filter(p=>normalizeSearchText(p.name).includes(q)).slice(0,30);
  if(!matches.length){
    box.innerHTML='<div class="search-item">Nenhum beneficiário encontrado.</div>';
    box.classList.add("open");
    return;
  }
  box.innerHTML=matches.map(p=>`
    <div class="search-item" data-id="${p.id}">
      <b>${p.name}</b>
      <small>${p.municipio} — ${p.localidade}</small>
    </div>
  `).join("");
  box.classList.add("open");
  box.querySelectorAll(".search-item[data-id]").forEach(item=>{
    item.onclick=()=>{
      const id=Number(item.dataset.id);
      const idx=points.findIndex(p=>p.id===id);
      if(idx>=0){
        current=idx;
        update(true);
        document.getElementById("beneficiarySearch").value=points[idx].name;
        box.classList.remove("open");
      }
    };
  });
}
document.getElementById("beneficiarySearch").addEventListener("input",e=>{
  renderSearchResults(e.target.value);
});
document.getElementById("beneficiarySearch").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const first=document.querySelector("#searchResults .search-item[data-id]");
    if(first) first.click();
  } else if(e.key==="Escape"){
    document.getElementById("searchResults").classList.remove("open");
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search-box")){
    document.getElementById("searchResults").classList.remove("open");
  }
});

</script>
<script>

let selectedMunicipality = "";

function normalizeMunicipality(s){
  return normalizeSearchText(s);
}

function populateMunicipalityFilter(){
  const select=document.getElementById("municipalityFilter");
  const municipalities=[...new Set(points.map(p=>p.municipio.trim()))]
    .sort((a,b)=>a.localeCompare(b,"pt-BR"));
  municipalities.forEach(m=>{
    const opt=document.createElement("option");
    opt.value=m;
    opt.textContent=m;
    select.appendChild(opt);
  });
}

function pointPassesMunicipality(p){
  return !selectedMunicipality ||
    normalizeMunicipality(p.municipio)===normalizeMunicipality(selectedMunicipality);
}

function applyMunicipalityFilter(){
  selectedMunicipality=document.getElementById("municipalityFilter").value;

  markers.forEach((marker,idx)=>{
    marker.setVisible(pointPassesMunicipality(points[idx]));
  });

  if(!pointPassesMunicipality(points[current])){
    const idx=points.findIndex(p=>pointPassesMunicipality(p));
    if(idx>=0){
      current=idx;
      update(true);
    }
  } else {
    update(false);
  }

  renderSearchResults(document.getElementById("beneficiarySearch").value);
}

document.getElementById("municipalityFilter").addEventListener("change", applyMunicipalityFilter);

renderSearchResults = function(term){
  const box=document.getElementById("searchResults");
  const q=normalizeSearchText(term);

  if(!q){
    box.classList.remove("open");
    box.innerHTML="";
    return;
  }

  const matches=points
    .filter(p=>pointPassesMunicipality(p))
    .filter(p=>normalizeSearchText(p.name).includes(q))
    .slice(0,30);

  if(!matches.length){
    box.innerHTML='<div class="search-item">Nenhum beneficiário encontrado.</div>';
    box.classList.add("open");
    return;
  }

  box.innerHTML=matches.map(p=>`
    <div class="search-item" data-id="${p.id}">
      <b>${p.name}</b>
      <small>${p.municipio} — ${p.localidade}</small>
    </div>
  `).join("");

  box.classList.add("open");

  box.querySelectorAll(".search-item[data-id]").forEach(item=>{
    item.onclick=()=>{
      const id=Number(item.dataset.id);
      const idx=points.findIndex(p=>p.id===id);
      if(idx>=0){
        current=idx;
        update(true);
        document.getElementById("beneficiarySearch").value=points[idx].name;
        box.classList.remove("open");
      }
    };
  });
};

const _initMapOriginal = initMap;
initMap = function(){
  _initMapOriginal();
  populateMunicipalityFilter();
  applyMunicipalityFilter();
};

</script>
<script>

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function copySpan(label, value){
  const safeValue=escapeHtml(value);
  const encoded=encodeURIComponent(value);
  return `<span class="copyable" data-copy="${encoded}" title="Clique para copiar">${label}: ${safeValue}</span>`;
}

async function copyValue(value){
  try{
    await navigator.clipboard.writeText(value);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=value;
    ta.style.position="fixed";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }

  const toast=document.getElementById("copyToast");
  toast.textContent="Copiado: "+value;
  toast.classList.add("show");
  clearTimeout(window.__copyToastTimer);
  window.__copyToastTimer=setTimeout(()=>toast.classList.remove("show"),1100);
}

document.addEventListener("click",e=>{
  const target=e.target.closest(".copyable");
  if(!target) return;
  e.stopPropagation();
  copyValue(decodeURIComponent(target.dataset.copy));
});

</script>
